name: Daily SEO Search Console Sync

on:
  schedule:
    # Daily at 03:20 UTC (08:50 IST)
    - cron: "20 3 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate required secrets
        env:
          PORTAL_BASE_URL: ${{ secrets.PORTAL_BASE_URL }}
          SEO_CRON_SECRET: ${{ secrets.SEO_CRON_SECRET }}
        run: |
          test -n "$PORTAL_BASE_URL" || (echo "Missing repository secret PORTAL_BASE_URL" && exit 1)
          test -n "$SEO_CRON_SECRET" || (echo "Missing repository secret SEO_CRON_SECRET" && exit 1)
      - name: Sync enabled clients from Google Search Console
        env:
          PORTAL_BASE_URL: ${{ secrets.PORTAL_BASE_URL }}
          SEO_CRON_SECRET: ${{ secrets.SEO_CRON_SECRET }}
        run: |
          BASE_URL="${PORTAL_BASE_URL%/}"
          curl --fail-with-body --silent --show-error \
            --max-time 840 \
            --request POST \
            --header "x-seo-cron-secret: $SEO_CRON_SECRET" \
            "$BASE_URL/api/seo/cron-sync"
