<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AQ Setu — Client Portal</title>

<style>
:root{
  --green:#2E8B57;
  --purple:#5A3FA0;
  --light:#F5F7FA;
  --ink:#222222;
  --muted:#6b7280;
  --line:#e7e9ee;
  --white:#fff;
  --red:#e5484d;
  --orange:#d98b20;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:var(--light);
  color:var(--ink)
}

button,input,select{font:inherit}

.app{
  display:flex;
  min-height:100vh
}

.sidebar{
  width:245px;
  background:#fff;
  border-right:1px solid var(--line);
  padding:22px 15px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:5
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 8px 24px
}

.brand img{
  width:47px;
  height:47px;
  object-fit:cover;
  border-radius:8px
}

.brand strong{font-size:18px}

.brand small{
  display:block;
  color:var(--green);
  font-size:10px;
  font-weight:700;
  margin-top:2px
}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px
}

.nav button{
  border:0;
  background:transparent;
  text-align:left;
  padding:12px 13px;
  border-radius:10px;
  color:#555;
  cursor:pointer;
  display:flex;
  gap:12px;
  align-items:center
}

.nav button:hover{background:#f3f5f7}

.nav button.active{
  background:linear-gradient(90deg,#eef8f2,#f2effa);
  color:var(--purple);
  font-weight:700
}

.icon{
  width:22px;
  text-align:center
}

.sidebar-footer{
  position:absolute;
  left:15px;
  right:15px;
  bottom:18px;
  border-top:1px solid var(--line);
  padding-top:14px;
  color:var(--muted);
  font-size:12px
}

.main{
  margin-left:245px;
  width:calc(100% - 245px)
}

.topbar{
  height:76px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:4
}

.crumb{
  color:var(--muted);
  font-size:13px
}

.user{
  display:flex;
  align-items:center;
  gap:10px
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--green),var(--purple));
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:700
}

.content{
  padding:28px;
  max-width:1500px;
  margin:auto
}

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px
}

.page-title h1{
  font-size:27px;
  margin:0
}

.page-title p{
  color:var(--muted);
  margin:6px 0 0
}

.btn{
  border:0;
  border-radius:9px;
  padding:10px 16px;
  cursor:pointer;
  font-weight:700
}

.btn-primary{
  background:var(--green);
  color:#fff
}

.btn-purple{
  background:var(--purple);
  color:#fff
}

.btn-light{
  background:#fff;
  border:1px solid var(--line)
}

.grid{
  display:grid;
  gap:16px
}

.kpi-grid{
  grid-template-columns:repeat(4,1fr)
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  box-shadow:0 2px 10px rgba(30,35,45,.03)
}

.kpi .label{
  color:var(--muted);
  font-size:13px
}

.kpi .value{
  font-size:25px;
  font-weight:800;
  margin:9px 0
}

.up{
  color:var(--green);
  font-size:12px;
  font-weight:700
}

.down{
  color:var(--red);
  font-size:12px;
  font-weight:700
}

.two{
  grid-template-columns:1.5fr 1fr
}

.three{
  grid-template-columns:repeat(3,1fr)
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px
}

.section-head h3{
  margin:0;
  font-size:16px
}

.chart{
  height:220px;
  position:relative;
  overflow:hidden
}

.chart svg{
  width:100%;
  height:100%
}

.table{
  width:100%;
  border-collapse:collapse
}

.table th,
.table td{
  text-align:left;
  padding:13px 10px;
  border-bottom:1px solid var(--line);
  font-size:13px
}

.table th{
  color:var(--muted);
  font-weight:600
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:700
}

.green{
  background:#eaf7ef;
  color:var(--green)
}

.purple{
  background:#f0ecfb;
  color:var(--purple)
}

.orange{
  background:#fff5e6;
  color:var(--orange)
}

.red{
  background:#fff0f0;
  color:var(--red)
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:16px
}

.tabs button{
  border:1px solid var(--line);
  background:#fff;
  padding:9px 15px;
  border-radius:8px;
  cursor:pointer
}

.tabs button.active{
  background:var(--green);
  color:#fff;
  border-color:var(--green)
}

.list{
  display:flex;
  flex-direction:column;
  gap:10px
}

.list-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px
}

.person{
  display:flex;
  align-items:center;
  gap:12px
}

.mini{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#edf2ef;
  display:grid;
  place-items:center;
  color:var(--green);
  font-weight:800
}

.actions{
  display:flex;
  gap:8px
}

.approval{
  display:grid;
  grid-template-columns:100px 1fr auto;
  gap:15px;
  align-items:center
}

.thumb{
  width:100px;
  height:70px;
  border-radius:8px;
  background:linear-gradient(135deg,#dfece5,#e7def6);
  display:grid;
  place-items:center;
  color:var(--purple);
  font-weight:800
}

.notification{
  display:flex;
  gap:13px;
  padding:14px;
  border-bottom:1px solid var(--line)
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--green);
  margin-top:7px
}

.login-wrap{
  min-height:100vh;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 85% 15%,#eee8fb,transparent 35%),
    #f7faf8
}

.login{
  width:min(420px,92vw);
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:34px;
  box-shadow:0 12px 45px rgba(30,30,40,.08)
}

.login-logo{
  text-align:center
}

.login-logo img{
  width:110px;
  height:110px;
  object-fit:cover;
  border-radius:12px
}

.login h1{
  text-align:center;
  font-size:25px
}

.login p{
  text-align:center;
  color:var(--muted)
}

.field{
  margin:14px 0
}

.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:6px
}

.field input{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:9px;
  outline:none
}

.field input:focus{
  border-color:var(--green)
}

.full{
  width:100%
}

.hidden{
  display:none!important
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(20,24,30,.45);
  display:grid;
  place-items:center;
  z-index:100;
}
.modal{
  width:min(520px,92vw);
  background:#fff;
  border-radius:16px;
  padding:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.18);
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
.modal-head h2{margin:0;font-size:20px}
.modal-close{
  border:0;background:transparent;font-size:24px;cursor:pointer;color:var(--muted);
}
.modal-actions{
  display:flex;justify-content:flex-end;gap:10px;margin-top:20px;
}
.error-message{
  color:var(--red);
  background:#fff0f0;
  border:1px solid #f4cccc;
  padding:10px;
  border-radius:8px;
  font-size:13px;
  margin:12px 0
}

.loading{
  opacity:.7;
  pointer-events:none
}

.hero{
  background:linear-gradient(135deg,var(--green),var(--purple));
  color:#fff;
  border:0
}

.hero .muted{
  color:#eee
}

.metric-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.metric{
  background:rgba(255,255,255,.13);
  padding:14px;
  border-radius:10px
}

.metric b{
  font-size:22px;
  display:block;
  margin-top:5px
}

.empty{
  padding:50px;
  text-align:center;
  color:var(--muted)
}

@media(max-width:1000px){
  .kpi-grid{
    grid-template-columns:repeat(2,1fr)
  }

  .two,.three{
    grid-template-columns:1fr
  }

  .sidebar{
    width:72px
  }

  .brand div,
  .nav button span,
  .sidebar-footer{
    display:none
  }

  .brand{
    justify-content:center
  }

  .main{
    margin-left:72px;
    width:calc(100% - 72px)
  }

  .nav button{
    justify-content:center
  }

  .content{
    padding:18px
  }

  .approval{
    grid-template-columns:70px 1fr
  }

  .thumb{
    width:70px;
    height:60px
  }
}

@media(max-width:600px){
  .topbar{
    padding:0 15px
  }

  .content{
    padding:14px
  }

  .kpi-grid{
    grid-template-columns:1fr 1fr
  }

  .kpi .value{
    font-size:20px
  }

  .page-title h1{
    font-size:22px
  }

  .metric-row{
    grid-template-columns:1fr
  }

  .approval{
    grid-template-columns:1fr
  }

  .thumb{
    width:100%;
    height:110px
  }
}
</style>
</head>

<body>

<div id="root"></div>

<script>

/* =========================================================
   AQ SETU CLIENT PORTAL
   Frontend connected to Node.js backend
   ========================================================= */

// Served by the Express backend, so use the same origin. Fall back to
// localhost only if the file is opened directly from disk.
const API_URL = location.protocol.startsWith("http")
  ? location.origin
  : "http://localhost:5000";

const state = {
  loggedIn: false,
  page: "Dashboard",
  role: "client",
  adminOverview: null,
  adminLoading: false,
  adminError: null,
  adminIntegrations: null,
  leadStatus: "All Leads",
  user: null,
  client: null,
  dashboard: null,
  dashboardLoading: false,
  dashboardError: null,
  meta: {
    status: null,        // response of /api/meta/status
    accounts: null,      // response of /api/meta/accounts
    syncing: false,
    message: null,       // {type:"ok"|"error", text}
    datePreset: "last_30d"
  }
};

const clientPages = [
  "Dashboard",
  "Campaigns",
  "Leads",
  "Social Media",
  "Content Approval",
  "SEO",
  "Reports",
  "Notifications",
  "Profile"
 ];

const adminPages = ["Admin Overview","Clients","Users","Integrations","Leads","Social Media","Profile"];

const icons = {
  "Admin Overview":"⌂",
  "Clients":"▦",
  "Users":"♙",
  "Integrations":"◈",
  "Dashboard":"⌂",
  "Campaigns":"◈",
  "Leads":"♙",
  "Social Media":"◫",
  "Content Approval":"✓",
  "SEO":"⌕",
  "Reports":"▤",
  "Notifications":"♢",
  "Profile":"⚙"
};


/* =========================================================
   LOGIN SCREEN
   ========================================================= */

function login(){

  return `
    <div class="login-wrap">

      <div class="login">

        <div class="login-logo">
          <img src="logo.jpg" alt="AQ Setu">
        </div>

        <h1>Welcome Back!</h1>

        <p>
          Sign in to your AQ Setu account
        </p>

        <div id="login-error" class="error-message hidden"></div>

        <div class="field">

          <label>Email address</label>

          <input
            id="email"
            type="email"
placeholder="Email address"
            autocomplete="username"
          >

        </div>

        <div class="field">

          <label>Password</label>

          <input
            id="password"
            type="password"
placeholder="Password"
            autocomplete="current-password"
          >

        </div>

        <button
          id="login-button"
          class="btn btn-primary full"
          onclick="doLogin()"
        >
          Sign In
        </button>

        <div style="
          text-align:center;
          color:#999;
          margin:16px 0;
          font-size:12px
        ">
          AQ Setu test client · AQSETU-001
        </div>

        <button
          id="google-login-button"
          class="btn btn-light full"
          type="button"
          onclick="continueWithGoogle()"
        >
          <span style="display:inline-flex;align-items:center;justify-content:center;gap:10px">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 48 48">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.01 13.22l7.98 6.19C11.88 13.72 17.46 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.76 7.18l7.73 6C44.42 37.92 46.98 31.7 46.98 24.55z"/>
              <path fill="#FBBC05" d="M9.99 28.59A14.4 14.4 0 0 1 9.2 24c0-1.59.28-3.13.78-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.52 2.58 10.78l7.41-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.14 1.44-4.89 2.3-8.18 2.3-6.54 0-12.12-4.22-14.01-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Continue with Google
          </span>
        </button>

      </div>

    </div>
  `;
}


/* =========================================================
   GOOGLE SIGN-IN
   ========================================================= */

let googleSignInInitialized = false;

function showLoginError(message){
  const errorBox = document.getElementById("login-error");
  if(!errorBox) return;
  errorBox.textContent = message;
  errorBox.classList.remove("hidden");
}

async function continueWithGoogle(){
  const button = document.getElementById("google-login-button");
  if(button){ button.disabled = true; button.style.opacity = ".7"; }
  try{
    const response = await fetch(`${API_URL}/api/auth/google-config`, { cache:"no-store" });
    const config = await response.json();
    if(!response.ok || !config.success) throw new Error(config.message || "Unable to load Google sign-in.");
    if(!config.enabled || !config.clientId){
      throw new Error("Google sign-in setup is incomplete. Ask the AQ Setu administrator to configure GOOGLE_CLIENT_ID.");
    }
    if(!window.google?.accounts?.id){
      await new Promise((resolve,reject)=>{
        const existing = document.querySelector('script[data-google-identity]');
        if(existing){
          existing.addEventListener("load",resolve,{once:true});
          existing.addEventListener("error",()=>reject(new Error("Could not load Google sign-in.")),{once:true});
          if(window.google?.accounts?.id) resolve();
          return;
        }
        const script=document.createElement("script");
        script.src="https://accounts.google.com/gsi/client";
        script.async=true;
        script.defer=true;
        script.dataset.googleIdentity="true";
        script.onload=resolve;
        script.onerror=()=>reject(new Error("Could not load Google sign-in. Check your internet connection and try again."));
        document.head.appendChild(script);
      });
    }
    if(!window.google?.accounts?.id) throw new Error("Google sign-in did not initialize. Please try again.");
    if(googleSignInInitialized) window.google.accounts.id.cancel();
    window.google.accounts.id.initialize({
      client_id: config.clientId,
      callback: handleGoogleCredential,
      auto_select: false,
      cancel_on_tap_outside: true
    });
    googleSignInInitialized = true;
    window.google.accounts.id.prompt(notification=>{
      if(notification.isNotDisplayed() && notification.getNotDisplayedReason() === "browser_not_supported"){
        showLoginError("This browser does not support Google sign-in. Try another browser.");
      }
    });
  }catch(error){
    showLoginError(error.message || "Unable to start Google sign-in.");
  }finally{
    if(button){ button.disabled = false; button.style.opacity = ""; }
  }
}

async function handleGoogleCredential(response){
  const button = document.getElementById("google-login-button");
  const errorBox = document.getElementById("login-error");
  if(errorBox) errorBox.classList.add("hidden");
  if(button){button.disabled=true;button.textContent="Signing in with Google...";}
  try{
    const result=await fetch(`${API_URL}/api/auth/google`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({credential:response.credential})
    });
    const data=await result.json();
    if(!result.ok || !data.success) throw new Error(data.message || "Google sign-in failed.");
    localStorage.setItem("aqsetu_token",data.token);
    localStorage.setItem("aqsetu_user",JSON.stringify(data.user));
    state.loggedIn=true;
    state.user=data.user;
    await loadClient();
  }catch(error){
    showLoginError(error.message || "Unable to sign in with Google.");
  }finally{
    const b=document.getElementById("google-login-button");
    if(b){b.disabled=false;b.innerHTML='<span style="display:inline-flex;align-items:center;justify-content:center;gap:10px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.01 13.22l7.98 6.19C11.88 13.72 17.46 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.76 7.18l7.73 6C44.42 37.92 46.98 31.7 46.98 24.55z"/><path fill="#FBBC05" d="M9.99 28.59A14.4 14.4 0 0 1 9.2 24c0-1.59.28-3.13.78-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.52 2.58 10.78l7.41-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.14 1.44-4.89 2.3-8.18 2.3-6.54 0-12.12-4.22-14.01-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Continue with Google</span>';}
  }
}


/* =========================================================
   REAL LOGIN
   ========================================================= */

async function doLogin(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const errorBox =
    document.getElementById("login-error");

  const loginButton =
    document.getElementById("login-button");

  errorBox.classList.add("hidden");

  if(!email || !password){

    errorBox.textContent =
      "Please enter your email and password.";

    errorBox.classList.remove("hidden");

    return;
  }

  loginButton.textContent = "Signing in...";
  loginButton.classList.add("loading");

  try{

    const response = await fetch(
      `${API_URL}/api/auth/login`,
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          email,
          password
        })
      }
    );

    const data = await response.json();

    if(!response.ok || !data.success){

      throw new Error(
        data.message || "Login failed."
      );
    }

    /*
      Save authentication information
    */

    localStorage.setItem(
      "aqsetu_token",
      data.token
    );

    localStorage.setItem(
      "aqsetu_user",
      JSON.stringify(data.user)
    );

    state.loggedIn = true;
    state.user = data.user;

    /*
      Load actual client information
    */

    await loadClient();

  }
  catch(error){

    console.error("Login error:",error);

    errorBox.textContent =
      error.message ||
      "Unable to connect to AQ Setu server.";

    errorBox.classList.remove("hidden");

  }
  finally{

    if(document.getElementById("login-button")){

      loginButton.textContent = "Sign In";
      loginButton.classList.remove("loading");

    }

  }
}


/* =========================================================
   LOAD CLIENT FROM BACKEND
   ========================================================= */

async function loadClient(){

  const token =
    localStorage.getItem("aqsetu_token");

  if(!token){

    logout();
    return;
  }

  if(state.user?.role === "admin"){
    state.client = null;
    await loadAdminOverview();
    state.loggedIn = true;
    render();
    return;
  }

  try{

    const response = await fetch(
      `${API_URL}/api/clients`,
      {
        method:"GET",

        headers:{
          "Authorization":`Bearer ${token}`
        }
      }
    );

    const data = await response.json();

    if(!response.ok || !data.success){

      throw new Error(
        data.message || "Unable to load client."
      );
    }

    state.client = data.client;

    state.loggedIn = true;

    await Promise.all([loadDashboard(), loadMetaStatus()]);

    render();

  } catch(error){

    console.error(
      "Client loading error:",
      error
    );

    localStorage.removeItem("aqsetu_token");

    state.loggedIn = false;

/* =========================================================
   FORMAT HELPERS (missing values render as an em dash)
   ========================================================= */

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function fmtNum(v){
  return (v === null || v === undefined || v === "")
    ? "—" : Number(v).toLocaleString("en-IN");
}

function fmtMoney(v){
  if(v === null || v === undefined || v === "") return "—";
  const cur = state.dashboard?.currency;
  try{
    return Number(v).toLocaleString("en-IN", {
      style:"currency",
      currency: cur || "INR",
      maximumFractionDigits: 2
    });
  }catch{
    return Number(v).toLocaleString("en-IN", { maximumFractionDigits:2 });
  }
}

function fmtPct(v){
  return (v === null || v === undefined || v === "")
    ? "—" : `${Number(v).toFixed(2)}%`;
}

function fmtDate(d){
  if(!d) return "";
  const dt = new Date(d.length === 10 ? d + "T00:00:00" : d);
  return isNaN(dt) ? "" : dt.toLocaleDateString("en-IN", {
    day:"2-digit", month:"short", year:"numeric"
  });
}

function rangeLabel(){
  const r = state.dashboard?.dateRange;
  return r ? `${fmtDate(r.start)} – ${fmtDate(r.stop)}` : "No data yet";
}

/* =========================================================
   AUTHENTICATED API HELPER
   ========================================================= */

async function apiRequest(
  endpoint,
  options = {}
){

  const token =
    localStorage.getItem("aqsetu_token");

  if(!token){

    logout();

    throw new Error(
      "Authentication required"
    );
  }

  const response = await fetch(
    `${API_URL}${endpoint}`,
    {
      ...options,

      headers:{
        "Content-Type":"application/json",
        ...(options.headers || {}),
        "Authorization":`Bearer ${token}`
      }
    }
  );

  const data = await response.json();

  if(response.status === 401){

    logout();

    throw new Error(
      "Session expired. Please log in again."
    );
  }

  if(!response.ok){

    throw new Error(
      data.message || "Request failed."
    );
  }

  return data;
}

let pendingImportRows = [];
function parseImportCsv(text){
  const rows=[];let row=[],cell="",quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],next=text[i+1];
    if(ch==='"'&&quoted&&next==='"'){cell+='"';i++;}
    else if(ch==='"'){quoted=!quoted;}
    else if(ch===","&&!quoted){row.push(cell.trim());cell="";}
    else if((ch==="\n"||ch==="\r")&&!quoted){if(ch==="\r"&&next==="\n")i++;row.push(cell.trim());if(row.some(v=>v!==""))rows.push(row);row=[];cell="";}
    else cell+=ch;
  }
  if(quoted)throw new Error("CSV has an unclosed quotation mark.");
  row.push(cell.trim());if(row.some(v=>v!==""))rows.push(row);
  if(rows.length<2)throw new Error("CSV must contain a header row and at least one data row.");
  const headers=rows.shift().map(h=>h.trim().toLowerCase().replace(/[\s-]+/g,"_"));
  if(headers.some(h=>!h)||new Set(headers).size!==headers.length)throw new Error("Column headers must be non-empty and unique.");
  return rows.map(values=>Object.fromEntries(headers.map((h,i)=>[h,values[i]||""])));
}

  pendingImportRows=[];const p=document.getElementById("import-preview");if(p)p.innerHTML="";

function previewImportFile(input){
  resetImportPreview();const file=input.files&&input.files[0];if(!file)return;
  if(!file.name.toLowerCase().endsWith(".csv")){alert("Please select a CSV file.");input.value="";return;}
  if(file.size>5*1024*1024){alert("CSV file must be 5 MB or smaller.");input.value="";return;}
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      pendingImportRows=parseImportCsv(String(reader.result||""));
      if(pendingImportRows.length>1000)throw new Error("Maximum 1,000 rows per import.");
      const preview=document.getElementById("import-preview"),headers=Object.keys(pendingImportRows[0]||{});
      preview.innerHTML="<p><b>"+pendingImportRows.length+" rows ready to review</b> · "+headers.map(esc).join(", ")+"</p><div style='overflow-x:auto;max-height:220px'><table class='table'><thead><tr>"+headers.map(h=>"<th>"+esc(h)+"</th>").join("")+"</tr></thead><tbody>"+pendingImportRows.slice(0,5).map(row=>"<tr>"+headers.map(h=>"<td>"+esc(row[h]||"—")+"</td>").join("")+"</tr>").join("")+"</tbody></table></div><p class='muted'>Showing first "+Math.min(5,pendingImportRows.length)+" rows.</p>";
      document.getElementById("import-submit").disabled=false;
    }catch(e){pendingImportRows=[];alert(e.message);input.value="";}
  };
  reader.onerror=()=>alert("Could not read this file.");
  reader.readAsText(file);
}
async function submitImportData(){

function dashboard(){

  const client = state.client?.display_name || "AQ Setu";
  const d = state.dashboard;
  const m = d?.metrics || {};
  const campaignsList = d?.campaigns || [];

  // Spend by campaign (real rows only)
  const spendRows = [...campaignsList]
    .filter(c => Number(c.spend) > 0)
    .sort((x, y) => Number(y.spend) - Number(x.spend))
    .slice(0, 6);
  const maxSpend = spendRows.length ? Number(spendRows[0].spend) : 0;

  // Leads by platform (real rows only)
  const byPlatform = {};
  campaignsList.forEach(c => {
    const k = c.platform || "other";
    byPlatform[k] = (byPlatform[k] || 0) + Number(c.leads || 0);
  });
  const platformRows = Object.entries(byPlatform).sort((x, y) => y[1] - x[1]);
  const maxPlatform = platformRows.length ? platformRows[0][1] : 0;
  const platformName = k => ({ meta:"Meta Ads", google:"Google Ads" }[k] || k);

  const kpi = (label, value, sub) => `
    <div class="card kpi">
      <div class="label">${label}</div>
      <div class="value">${value}</div>
      <div class="muted" style="font-size:12px">${sub || "&nbsp;"}</div>
    </div>`;

  return title(
    `Welcome, ${esc(client)} 👋`,
    "Your marketing performance at a glance.",
    `<button class="btn btn-light" onclick="go('Campaigns')">${esc(rangeLabel())}</button>`
  )
  + dataBanner()
  + `
    <div class="grid kpi-grid">
      ${kpi("Total Ad Spend", fmtMoney(m.totalSpend), `${fmtNum(m.totalImpressions)} impressions`)}
      ${kpi("Clicks", fmtNum(m.totalClicks), `CTR ${fmtPct(m.ctr)}`)}
      ${kpi("Total Leads", fmtNum(m.totalLeads), m.cpl === null || m.cpl === undefined ? "No lead data" : `CPL ${fmtMoney(m.cpl)}`)}
      ${kpi("ROAS", m.roas === null || m.roas === undefined ? "—" : `${Number(m.roas).toFixed(2)}×`, m.roas === null || m.roas === undefined ? "No revenue data" : "Reported by Meta")}
    </div>

    <div style="height:16px"></div>

    <div class="grid two">

      <div class="card">
        <div class="section-head">
          <h3>Spend by Campaign</h3>
          <span class="badge purple">${esc(rangeLabel())}</span>
        </div>
        ${spendRows.length
          ? spendRows.map(c => bar(esc(c.campaign_name), fmtMoney(c.spend), Math.max(4, Number(c.spend) / maxSpend * 100), "var(--green)")).join("")
          : `<div class="muted" style="padding:24px 0">No spend recorded for this period.</div>`}
      </div>

      <div class="card">
        <div class="section-head">
          <h3>Leads by Channel</h3>
          <span style="color:var(--muted);font-size:12px">Leads</span>
        </div>
        ${maxPlatform > 0
          ? platformRows.map(([k, v]) => bar(esc(platformName(k)), fmtNum(v), Math.max(4, v / maxPlatform * 100), "var(--purple)")).join("")
          : `<div class="muted" style="padding:24px 0">No leads reported yet. Campaigns that are not lead-generation campaigns will not show leads.</div>`}
      </div>

    </div>

    <div style="height:16px"></div>

    <div class="card hero">
      <div class="section-head">
        <div>
          <h3>Marketing Snapshot</h3>
          <div class="muted">${esc(d?.meta?.adAccountName || client)}${d?.dataSource === "manual" ? " · sample data" : ""}</div>
        </div>
        <button class="btn" style="background:#fff;color:var(--purple)" onclick="go('Reports')">View Reports</button>
      </div>
      <div class="metric-row">
        <div class="metric">Leads<b>${fmtNum(m.totalLeads)}</b></div>
        <div class="metric">CPL<b>${fmtMoney(m.cpl)}</b></div>
        <div class="metric">Conversion Rate<b>${fmtPct(m.conversionRate)}</b></div>
      </div>
    </div>
  `;
}

function metaConnectionBar(){

  const st = state.meta.status;
  const conn = st?.connection;
  const msg = state.meta.message;
  const presets = [
    ["last_7d","Last 7 days"],["last_14d","Last 14 days"],["last_30d","Last 30 days"],
    ["last_90d","Last 90 days"],["this_month","This month"],["last_month","Last month"]
  ];

  let body;
  if(!st){
    body = `<span class="muted">Checking Meta connection…</span>`;
  } else if(!st.connected){
    body = `
      <span>${st.expired
        ? "Your Meta connection expired. Please reconnect."
        : "No Meta ad account is connected."}</span>
      <button class="btn btn-primary" onclick="connectMeta()">
        ${st.expired ? "Reconnect Meta" : "Connect Meta"}
      </button>`;
  } else {
    const accounts = state.meta.accounts?.accounts;
    body = `
      <span>
        <b>${esc(conn.ad_account_name || conn.ad_account_id || "No ad account selected")}</b>
        ${conn.ad_account_id ? `<span class="muted"> · ${esc(conn.ad_account_id)}</span>` : ""}
        <br><span class="muted" style="font-size:12px">
          ${conn.last_synced_at ? `Last synced ${esc(new Date(conn.last_synced_at).toLocaleString("en-IN"))}` : "Never synced"}
        </span>
      </span>
      <span style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        ${accounts ? `
          <select onchange="selectAdAccount(this.value)" style="padding:8px;border:1px solid var(--line);border-radius:8px">
            <option value="">Choose ad account…</option>
            ${accounts.map(a => `<option value="${esc(a.id)}" ${a.id === conn.ad_account_id ? "selected" : ""}>${esc(a.name)} (${esc(a.id)})</option>`).join("")}
          </select>` : `<button class="btn btn-light" onclick="loadMetaAccounts()">Change account</button>`}
        <select onchange="setDatePreset(this.value)" style="padding:8px;border:1px solid var(--line);border-radius:8px">
          ${presets.map(([v,l]) => `<option value="${v}" ${v === state.meta.datePreset ? "selected" : ""}>${l}</option>`).join("")}
        </select>
        <button class="btn btn-primary" ${state.meta.syncing || !conn.ad_account_id ? "disabled" : ""} onclick="syncMeta()">
          ${state.meta.syncing ? "Syncing…" : "Sync now"}
        </button>
      </span>`;
  }

  return `
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">${body}</div>
      ${msg ? `<div style="margin-top:10px;font-size:13px;color:${msg.type === "error" ? "#c0392b" : "#2E8B57"}">${esc(msg.text)}</div>` : ""}
    </div>`;
}

 catch(e){alert(e.message);}

function downloadReport(reportType){
 const d=state.dashboard||{},m=d.metrics||{},campaigns=d.campaigns||[];
 const isGoogle=/google/i.test(reportType),isSeo=/seo/i.test(reportType),isSocial=/social/i.test(reportType);
 let details='';
 if(isGoogle)details='<p>Google Ads is not connected to this portal yet. No Google Ads metrics are included.</p>';
 else if(isSeo)details='<p>Search Console is not connected to this report. The SEO dashboard currently displays sample metrics.</p>';
 else if(isSocial)details='<p>Social post records are listed in the Social Media page. This report contains the currently loaded dashboard data and does not imply social analytics are fully synced.</p>';
 else details='<h2>Campaign summary</h2><p>Total spend: '+esc(fmtMoney(m.totalSpend))+'</p><p>Impressions: '+esc(fmtNum(m.totalImpressions))+'</p><p>Clicks: '+esc(fmtNum(m.totalClicks))+'</p><p>Leads: '+esc(fmtNum(m.totalLeads))+'</p><h2>Campaigns</h2><table border="1" cellspacing="0" cellpadding="6"><thead><tr><th>Campaign</th><th>Status</th><th>Spend</th><th>Impressions</th><th>Clicks</th><th>Leads</th></tr></thead><tbody>'+campaigns.map(c=>'<tr><td>'+esc(c.campaign_name)+'</td><td>'+esc(c.status)+'</td><td>'+esc(fmtMoney(c.spend))+'</td><td>'+esc(fmtNum(c.impressions))+'</td><td>'+esc(fmtNum(c.clicks))+'</td><td>'+esc(fmtNum(c.leads))+'</td></tr>').join('')+'</tbody></table>';
 const html='<!doctype html><html><head><meta charset="utf-8"><title>'+esc(reportType)+'</title><style>body{font:15px Arial,sans-serif;margin:36px;color:#222}h1{color:#5A3FA0}table{border-collapse:collapse;width:100%}th{background:#f3f0fa}</style></head><body><h1>AQ Setu — '+esc(reportType)+'</h1><p>Generated '+new Date().toLocaleString('en-IN')+'</p><p>Client: '+esc(state.client?.display_name||'AQ Setu')+'</p>'+details+'<hr><small>Generated from data currently available in the AQ Setu Client Portal. Missing integrations are identified above.</small></body></html>';
 const blob=new Blob([html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='aq-setu-'+reportType.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.html';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}

 + '<div class="card"><div class="list">'+types.map(item=>'<div class="list-item"><div><b>'+esc(item)+'</b><div class="muted" style="margin-top:4px">HTML report · generated on demand</div></div><button class="btn btn-light" onclick="downloadReport(\''+item+'\')">View / Download</button></div>').join('')+'</div><p class="muted">Reports clearly label integrations or metrics that are not connected, rather than inventing results.</p></div>';
}

async function openProfileSettings(){
  const u=state.user||{};
  const name=prompt('Account name:',u.name||''); if(name===null)return;
  const email=prompt('Email address:',u.email||''); if(email===null)return;
  try{
    const d=await apiRequest('/api/auth/profile',{method:'PATCH',body:JSON.stringify({name:name.trim(),email:email.trim()})});
    state.user={...(state.user||{}),...d.user};
    localStorage.setItem('aqsetu_user',JSON.stringify(state.user));
    render(); alert('Account settings updated.');
  }catch(e){alert(e.message);}
}

function openNotificationSettings(){
  const enabled=localStorage.getItem('aqsetu_notifications')==='true';
  if(confirm(enabled?'Notifications are ON. Turn them OFF?':'Notifications are OFF. Turn them ON?')){

    alert('Notification setting updated.');
  }
}

  try{
    await apiRequest('/api/auth/password',{method:'POST',body:JSON.stringify({currentPassword,newPassword})});
    alert('Password changed successfully.');
  }catch(e){alert(e.message);}
}

/* =========================================================
   INITIAL SESSION CHECK
   ========================================================= */

async function initializeApp(){

  const token =
    localStorage.getItem("aqsetu_token");

  const savedUser =
    localStorage.getItem("aqsetu_user");

  if(token){

    state.loggedIn = true;

    if(savedUser){

      try{

        state.user =
          JSON.parse(savedUser);

      }
      catch{

        state.user = null;

      }

    }

    await loadClient();

  }
  else{

    render();

  }

}


/* START APPLICATION */
