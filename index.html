<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AQ Setu — Client Portal</title>

<style>
:root{
  --green:#2E8B57;
  --purple:#5A3FA0;
  --light:#F5F7FA;
  --ink:#222222;
  --muted:#6b7280;
  --line:#e7e9ee;
  --white:#fff;
  --red:#e5484d;
  --orange:#d98b20;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:var(--light);
  color:var(--ink)
}

button,input,select{font:inherit}

.app{
  display:flex;
  min-height:100vh
}

.sidebar{
  width:245px;
  background:#fff;
  border-right:1px solid var(--line);
  padding:22px 15px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:5
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 8px 24px
}

.brand img{
  width:47px;
  height:47px;
  object-fit:cover;
  border-radius:8px
}

.brand strong{font-size:18px}

.brand small{
  display:block;
  color:var(--green);
  font-size:10px;
  font-weight:700;
  margin-top:2px
}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px
}

.nav button{
  border:0;
  background:transparent;
  text-align:left;
  padding:12px 13px;
  border-radius:10px;
  color:#555;
  cursor:pointer;
  display:flex;
  gap:12px;
  align-items:center
}

.nav button:hover{background:#f3f5f7}

.nav button.active{
  background:linear-gradient(90deg,#eef8f2,#f2effa);
  color:var(--purple);
  font-weight:700
}

.icon{
  width:22px;
  text-align:center
}

.sidebar-footer{
  position:absolute;
  left:15px;
  right:15px;
  bottom:18px;
  border-top:1px solid var(--line);
  padding-top:14px;
  color:var(--muted);
  font-size:12px
}

.main{
  margin-left:245px;
  width:calc(100% - 245px)
}

.topbar{
  height:76px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:4
}

.crumb{
  color:var(--muted);
  font-size:13px
}

.user{
  display:flex;
  align-items:center;
  gap:10px
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--green),var(--purple));
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:700
}

.content{
  padding:28px;
  max-width:1500px;
  margin:auto
}

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px
}

.page-title h1{
  font-size:27px;
  margin:0
}

.page-title p{
  color:var(--muted);
  margin:6px 0 0
}

.btn{
  border:0;
  border-radius:9px;
  padding:10px 16px;
  cursor:pointer;
  font-weight:700
}

.btn-primary{
  background:var(--green);
  color:#fff
}

.btn-purple{
  background:var(--purple);
  color:#fff
}

.btn-light{
  background:#fff;
  border:1px solid var(--line)
}

.grid{
  display:grid;
  gap:16px
}

.kpi-grid{
  grid-template-columns:repeat(4,1fr)
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  box-shadow:0 2px 10px rgba(30,35,45,.03)
}

.kpi .label{
  color:var(--muted);
  font-size:13px
}

.kpi .value{
  font-size:25px;
  font-weight:800;
  margin:9px 0
}

.up{
  color:var(--green);
  font-size:12px;
  font-weight:700
}

.down{
  color:var(--red);
  font-size:12px;
  font-weight:700
}

.two{
  grid-template-columns:1.5fr 1fr
}

.three{
  grid-template-columns:repeat(3,1fr)
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px
}

.section-head h3{
  margin:0;
  font-size:16px
}

.chart{
  height:220px;
  position:relative;
  overflow:hidden
}

.chart svg{
  width:100%;
  height:100%
}

.table{
  width:100%;
  border-collapse:collapse
}

.table th,
.table td{
  text-align:left;
  padding:13px 10px;
  border-bottom:1px solid var(--line);
  font-size:13px
}

.table th{
  color:var(--muted);
  font-weight:600
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:700
}

.green{
  background:#eaf7ef;
  color:var(--green)
}

.purple{
  background:#f0ecfb;
  color:var(--purple)
}

.orange{
  background:#fff5e6;
  color:var(--orange)
}

.red{
  background:#fff0f0;
  color:var(--red)
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:16px
}

.tabs button{
  border:1px solid var(--line);
  background:#fff;
  padding:9px 15px;
  border-radius:8px;
  cursor:pointer
}

.tabs button.active{
  background:var(--green);
  color:#fff;
  border-color:var(--green)
}

.list{
  display:flex;
  flex-direction:column;
  gap:10px
}

.list-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px
}

.person{
  display:flex;
  align-items:center;
  gap:12px
}

.mini{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#edf2ef;
  display:grid;
  place-items:center;
  color:var(--green);
  font-weight:800
}

.actions{
  display:flex;
  gap:8px
}

.approval{
  display:grid;
  grid-template-columns:100px 1fr auto;
  gap:15px;
  align-items:center
}

.thumb{
  width:100px;
  height:70px;
  border-radius:8px;
  background:linear-gradient(135deg,#dfece5,#e7def6);
  display:grid;
  place-items:center;
  color:var(--purple);
  font-weight:800
}

.notification{
  display:flex;
  gap:13px;
  padding:14px;
  border-bottom:1px solid var(--line)
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--green);
  margin-top:7px
}

.login-wrap{
  min-height:100vh;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 85% 15%,#eee8fb,transparent 35%),
    #f7faf8
}

.login{
  width:min(420px,92vw);
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:34px;
  box-shadow:0 12px 45px rgba(30,30,40,.08)
}

.login-logo{
  text-align:center
}

.login-logo img{
  width:110px;
  height:110px;
  object-fit:cover;
  border-radius:12px
}

.login h1{
  text-align:center;
  font-size:25px
}

.login p{
  text-align:center;
  color:var(--muted)
}

.field{
  margin:14px 0
}

.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:6px
}

.field input{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:9px;
  outline:none
}

.field input:focus{
  border-color:var(--green)
}

.full{
  width:100%
}

.hidden{
  display:none!important
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(20,24,30,.45);
  display:grid;
  place-items:center;
  z-index:100;
}
.modal{
  width:min(520px,92vw);
  background:#fff;
  border-radius:16px;
  padding:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.18);
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
.modal-head h2{margin:0;font-size:20px}
.modal-close{
  border:0;background:transparent;font-size:24px;cursor:pointer;color:var(--muted);
}
.modal-actions{
  display:flex;justify-content:flex-end;gap:10px;margin-top:20px;
}
.error-message{
  color:var(--red);
  background:#fff0f0;
  border:1px solid #f4cccc;
  padding:10px;
  border-radius:8px;
  font-size:13px;
  margin:12px 0
}

.loading{
  opacity:.7;
  pointer-events:none
}

.hero{
  background:linear-gradient(135deg,var(--green),var(--purple));
  color:#fff;
  border:0
}

.hero .muted{
  color:#eee
}

.metric-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.metric{
  background:rgba(255,255,255,.13);
  padding:14px;
  border-radius:10px
}

.metric b{
  font-size:22px;
  display:block;
  margin-top:5px
}

.empty{
  padding:50px;
  text-align:center;
  color:var(--muted)
}

@media(max-width:1000px){
  .kpi-grid{
    grid-template-columns:repeat(2,1fr)
  }

  .two,.three{
    grid-template-columns:1fr
  }

  .sidebar{
    width:72px
  }

  .brand div,
  .nav button span,
  .sidebar-footer{
    display:none
  }

  .brand{
    justify-content:center
  }

  .main{
    margin-left:72px;
    width:calc(100% - 72px)
  }

  .nav button{
    justify-content:center
  }

  .content{
    padding:18px
  }

  .approval{
    grid-template-columns:70px 1fr
  }

  .thumb{
    width:70px;
    height:60px
  }
}

@media(max-width:600px){
  .topbar{
    padding:0 15px
  }

  .content{
    padding:14px
  }

  .kpi-grid{
    grid-template-columns:1fr 1fr
  }

  .kpi .value{
    font-size:20px
  }

  .page-title h1{
    font-size:22px
  }

  .metric-row{
    grid-template-columns:1fr
  }

  .approval{
    grid-template-columns:1fr
  }

  .thumb{
    width:100%;
    height:110px
  }
}

</style>

const googleAdsReportState = { loading: false, error: "", assetError: "", keywordError: "", searchError: "", negativeError: "", diagnosticsError: "", callsError: "", data: null, assetsData: null, keywordsData: null, searchData: null, negativeData: null, diagnosticsData: null, callsData: null, comparisonData: null, startDate: "", endDate: "" };

const clientPages = [
  "Dashboard",
  "Meta Ads",
  "Google Ads",
  "Leads",
  "Social Media",
  "Content Approval",
  "SEO",
  "Reports",
  "Notifications",
  "Profile"
 ];

const adminPages = ["Admin Overview","Clients","Users","Integrations","Leads","Social Media","Profile"];

const icons = {
  "Admin Overview":"⌂",
  "Clients":"▦",
  "Users":"♙",
  "Integrations":"◈",
  "Dashboard":"⌂",
  "Meta Ads":"◈",

/* =========================================================
   LOGIN SCREEN
   ========================================================= */

function login(){

  return `

/* =========================================================
   GOOGLE SIGN-IN
   ========================================================= */

let googleSignInInitialized = false;

function showLoginError(message){
  const errorBox = document.getElementById("login-error");
  if(!errorBox) return;
  errorBox.textContent = message;
  errorBox.classList.remove("hidden");
}

async function continueWithGoogle(){
  const button = document.getElementById("google-login-button");
  if(button){ button.disabled = true; button.style.opacity = ".7"; }
  try{
    const response = await fetch(`${API_URL}/api/auth/google-config`, { cache:"no-store" });
    const config = await response.json();
    if(!response.ok || !config.success) throw new Error(config.message || "Unable to load Google sign-in.");
    if(!config.enabled || !config.clientId){
      throw new Error("Google sign-in setup is incomplete. Ask the AQ Setu administrator to configure GOOGLE_CLIENT_ID.");
    }
    if(!window.google?.accounts?.id){
      await new Promise((resolve,reject)=>{
        const existing = document.querySelector('script[data-google-identity]');
        if(existing){
          existing.addEventListener("load",resolve,{once:true});
          existing.addEventListener("error",()=>reject(new Error("Could not load Google sign-in.")),{once:true});
          if(window.google?.accounts?.id) resolve();
          return;
        }
        const script=document.createElement("script");
        script.src="https://accounts.google.com/gsi/client";
        script.async=true;
        script.defer=true;
        script.dataset.googleIdentity="true";
        script.onload=resolve;
        script.onerror=()=>reject(new Error("Could not load Google sign-in. Check your internet connection and try again."));
        document.head.appendChild(script);
      });
    }
    if(!window.google?.accounts?.id) throw new Error("Google sign-in did not initialize. Please try again.");
    if(googleSignInInitialized) window.google.accounts.id.cancel();
    window.google.accounts.id.initialize({
      client_id: config.clientId,
      callback: handleGoogleCredential,
      auto_select: false,
      cancel_on_tap_outside: true
    });
    googleSignInInitialized = true;
    window.google.accounts.id.prompt(notification=>{
      if(notification.isNotDisplayed() && notification.getNotDisplayedReason() === "browser_not_supported"){
        showLoginError("This browser does not support Google sign-in. Try another browser.");
      }
    });
  }catch(error){
    showLoginError(error.message || "Unable to start Google sign-in.");
  }finally{
    if(button){ button.disabled = false; button.style.opacity = ""; }
  }
}

async function handleGoogleCredential(response){
  const button = document.getElementById("google-login-button");
  const errorBox = document.getElementById("login-error");
  if(errorBox) errorBox.classList.add("hidden");
  if(button){button.disabled=true;button.textContent="Signing in with Google...";}
  try{
    const result=await fetch(`${API_URL}/api/auth/google`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({credential:response.credential})
    });
    const data=await result.json();
    if(!result.ok || !data.success) throw new Error(data.message || "Google sign-in failed.");
    sessionStorage.setItem("aqsetu_token",data.token);
    sessionStorage.setItem("aqsetu_user",JSON.stringify(data.user));
    state.loggedIn=true;
    state.user=data.user;
    await loadClient();
  }catch(error){
    showLoginError(error.message || "Unable to sign in with Google.");
  }finally{

/* =========================================================

   ========================================================= */

async function doLogin(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const errorBox =
    document.getElementById("login-error");

  const loginButton =
    document.getElementById("login-button");

  errorBox.classList.add("hidden");

  if(!email || !password){

    errorBox.textContent =
      "Please enter your email and password.";

    errorBox.classList.remove("hidden");

    return;
  }

  loginButton.textContent = "Signing in...";
  loginButton.classList.add("loading");

  try{

    const response = await fetch(
      `${API_URL}/api/auth/login`,
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          email,
          password
        })
      }
    );

    const data = await response.json();

    if(!response.ok || !data.success){

      throw new Error(
        data.message || "Login failed."
      );
    }

    /*
      Save authentication information
    */

    // Keep credential login consistent with Google login and loadClient(),
    // which both use sessionStorage for the active session.
    sessionStorage.setItem(
      "aqsetu_token",
      data.token
    );

    sessionStorage.setItem(
      "aqsetu_user",
      JSON.stringify(data.user)
    );

    state.loggedIn = true;
    state.user = data.user;

    /*
      Load actual client information
    */

    await loadClient();

  }
  catch(error){

    console.error("Login error:",error);

    errorBox.textContent =
      error.message ||
      "Unable to connect to AQ Setu server.";

    errorBox.classList.remove("hidden");

  }
  finally{

    if(document.getElementById("login-button")){

      loginButton.textContent = "Sign In";
      loginButton.classList.remove("loading");

    }

  }
}

async function loadClient(){

  const token =
    sessionStorage.getItem("aqsetu_token");

  if(!token){

    logout();
    return;
  }

  if(state.user?.role === "admin"){
    state.client = null;
    await loadAdminOverview();
    state.loggedIn = true;
    render();
    return;
  }

  try{

    const response = await fetch(
      `${API_URL}/api/clients`,
      {
        method:"GET",

        headers:{
          "Authorization":`Bearer ${token}`
        }
      }
    );

    const data = await response.json();

    if(!response.ok || !data.success){

      throw new Error(
        data.message || "Unable to load client."
      );
    }

    state.client = data.client;

    state.loggedIn = true;

    await Promise.all([loadDashboard(), loadMetaStatus(), loadSeoStatus()]);

    render();

  } catch(error){

    console.error(
      "Client loading error:",
      error
    );

    sessionStorage.removeItem("aqsetu_token");

    state.loggedIn = false;
    state.user = null;
    state.client = null;
    state.dashboard = null;

    render();

  }

}

/* =========================================================
   FORMAT HELPERS (missing values render as an em dash)
   ========================================================= */

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function fmtNum(v){
  return (v === null || v === undefined || v === "")
    ? "—" : Number(v).toLocaleString("en-IN");
}

function fmtMoney(v){
  if(v === null || v === undefined || v === "") return "—";
  const cur = state.dashboard?.currency;
  try{
    return Number(v).toLocaleString("en-IN", {
      style:"currency",
      currency: cur || "INR",
      maximumFractionDigits: 2
    });
  }catch{
    return Number(v).toLocaleString("en-IN", { maximumFractionDigits:2 });
  }
}

function fmtPct(v){
  return (v === null || v === undefined || v === "")
    ? "—" : `${Number(v).toFixed(2)}%`;
}

function fmtDate(d){
  if(!d) return "";
  const dt = new Date(d.length === 10 ? d + "T00:00:00" : d);
  return isNaN(dt) ? "" : dt.toLocaleDateString("en-IN", {
    day:"2-digit", month:"short", year:"numeric"
  });
}

function rangeLabel(){
  const r = state.dashboard?.dateRange;
  return r ? `${fmtDate(r.start)} – ${fmtDate(r.stop)}` : "No data yet";
}

    }">

      </div>

  const goCampaigns = `<button class="btn btn-primary" onclick="go('Campaigns')">Open Campaigns</button>`;

  if(state.dashboardError) return box(`Could not load dashboard data: ${esc(state.dashboardError)}`, "error",
    `<button class="btn btn-light" onclick="reloadDashboard()">Retry</button>`);
  if(!d) return "";

/* =========================================================
   AUTHENTICATED API HELPER
   ========================================================= */

async function apiRequest(
  endpoint,
  options = {}
){

  const token =
    sessionStorage.getItem("aqsetu_token");

  if(!token){

    logout();

    throw new Error(
      "Authentication required"
    );
  }

  const response = await fetch(
    `${API_URL}${endpoint}`,
    {
      ...options,

      headers:{
        "Content-Type":"application/json",
        ...(options.headers || {}),
        "Authorization":`Bearer ${token}`
      }
    }
  );

  const data = await response.json();

  if(response.status === 401){

    logout();

    throw new Error(
      "Session expired. Please log in again."
    );
  }

  if(!response.ok){

    throw new Error(
      data.message || "Request failed."
    );
  }

  return data;
}

let pendingImportRows = [];
function parseImportCsv(text){
  const rows=[];let row=[],cell="",quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],next=text[i+1];
    if(ch==='"'&&quoted&&next==='"'){cell+='"';i++;}
    else if(ch==='"'){quoted=!quoted;}
    else if(ch===","&&!quoted){row.push(cell.trim());cell="";}
    else if((ch==="\n"||ch==="\r")&&!quoted){if(ch==="\r"&&next==="\n")i++;row.push(cell.trim());if(row.some(v=>v!==""))rows.push(row);row=[];cell="";}
    else cell+=ch;
  }
  if(quoted)throw new Error("CSV has an unclosed quotation mark.");
  row.push(cell.trim());if(row.some(v=>v!==""))rows.push(row);
  if(rows.length<2)throw new Error("CSV must contain a header row and at least one data row.");
  const headers=rows.shift().map(h=>h.trim().toLowerCase().replace(/[\s-]+/g,"_"));
  if(headers.some(h=>!h)||new Set(headers).size!==headers.length)throw new Error("Column headers must be non-empty and unique.");
  return rows.map(values=>Object.fromEntries(headers.map((h,i)=>[h,values[i]||""])));
}

function resetImportPreview(){
  pendingImportRows=[];const p=document.getElementById("import-preview");if(p)p.innerHTML="";
  const s=document.getElementById("import-submit");if(s){s.disabled=true;s.textContent="Import Data";}
  const h=document.getElementById("import-help");if(h)h.textContent=document.getElementById("import-type").value==="campaigns"?"Campaign headers: campaign_name, platform, spend, impressions, clicks, leads, conversions, cpl, roas, date_start, date_stop, status. Platforms: meta, google, linkedin, tiktok, other.":"Lead headers: name, email, phone, source, campaign, status, notes. Each lead needs a name and email or phone.";

function previewImportFile(input){
  resetImportPreview();const file=input.files&&input.files[0];if(!file)return;
  if(!file.name.toLowerCase().endsWith(".csv")){alert("Please select a CSV file.");input.value="";return;}
  if(file.size>5*1024*1024){alert("CSV file must be 5 MB or smaller.");input.value="";return;}
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      pendingImportRows=parseImportCsv(String(reader.result||""));
      if(pendingImportRows.length>1000)throw new Error("Maximum 1,000 rows per import.");
      const preview=document.getElementById("import-preview"),headers=Object.keys(pendingImportRows[0]||{});
      preview.innerHTML="<p><b>"+pendingImportRows.length+" rows ready to review</b> · "+headers.map(esc).join(", ")+"</p><div style='overflow-x:auto;max-height:220px'><table class='table'><thead><tr>"+headers.map(h=>"<th>"+esc(h)+"</th>").join("")+"</tr></thead><tbody>"+pendingImportRows.slice(0,5).map(row=>"<tr>"+headers.map(h=>"<td>"+esc(row[h]||"—")+"</td>").join("")+"</tr>").join("")+"</tbody></table></div><p class='muted'>Showing first "+Math.min(5,pendingImportRows.length)+" rows.</p>";
      document.getElementById("import-submit").disabled=false;
    }catch(e){pendingImportRows=[];alert(e.message);input.value="";}
  };
  reader.onerror=()=>alert("Could not read this file.");
  reader.readAsText(file);
}
async function submitImportData(){
  const rows=pendingImportRows;if(!rows.length)return;
  const button=document.getElementById("import-submit");button.disabled=true;button.textContent="Importing…";
  try{

    alert("Import complete. Received: "+result.received+"; imported: "+result.imported+"; skipped as duplicates: "+result.skipped+".");
    closeImportModal();await adminRefresh();
  }catch(e){alert(e.message);button.disabled=false;button.textContent="Import Data";}
}

async function loadGoogleAdsPanel(){
  googleAdsState.loading = true;
  try{
    const results = await Promise.all([apiRequest("/api/google-ads/status"),apiRequest("/api/google-ads/client-accounts")]);
    googleAdsState.status = results[0];
    googleAdsState.clients = results[1].clients || [];
    const client = googleAdsState.clients.find(c => String(c.id) === String(googleAdsState.selectedClientId));
    googleAdsState.selectedAccountIds = (client?.accounts || []).map(a => String(a.customerId));
    googleAdsState.message = null;
  }catch(error){ googleAdsState.message = {type:"error",text:error.message || "Unable to load Google Ads status."}; }
  finally{ googleAdsState.loading = false; }
}
async function connectGoogleAds(){
  try{
    const data = await apiRequest("/api/google-ads/connect",{method:"POST"});
    if(!data.success || !data.authorizationUrl) throw new Error(data.message || "Could not start Google Ads authorization.");
    window.location.href = data.authorizationUrl;
  }catch(error){ googleAdsState.message = {type:"error",text:error.message || "Unable to start Google Ads connection."}; render(); }
}
async function syncGoogleAdsAccounts(){
  googleAdsState.syncing = true; googleAdsState.message = null; render();
  try{
    const data = await apiRequest("/api/google-ads/sync-accounts",{method:"POST"});
    if(!data.success) throw new Error(data.message || "Account sync failed.");
    googleAdsState.accounts = data.accounts || [];
    googleAdsState.message = {type:"ok",text:"Synced " + (data.synced || 0) + " Google Ads account(s)."};
    await loadGoogleAdsPanel(); googleAdsState.accounts = data.accounts || [];
  }catch(error){ googleAdsState.message = {type:"error",text:error.message || "Unable to sync Google Ads accounts."}; }
  finally{ googleAdsState.syncing = false; render(); }
}
function googleAdsClientChanged(clientId){
  googleAdsState.selectedClientId = clientId;
  const client = googleAdsState.clients.find(c => String(c.id) === String(clientId));
  googleAdsState.selectedAccountIds = (client?.accounts || []).map(a => String(a.customerId)); render();
}
function googleAdsAccountToggled(customerId, checked){
  const id = String(customerId);
  if(checked && !googleAdsState.selectedAccountIds.includes(id)) googleAdsState.selectedAccountIds.push(id);
  if(!checked) googleAdsState.selectedAccountIds = googleAdsState.selectedAccountIds.filter(x => x !== id);
}

async function applyGoogleAdsComparisonDates(){
  const start=document.getElementById("google-comparison-start")?.value||"";
  const end=document.getElementById("google-comparison-end")?.value||"";
  if(!/^\d{4}-\d{2}-\d{2}$/.test(start)||!/^\d{4}-\d{2}-\d{2}$/.test(end)){alert("Please select both dates.");return;}
  if(start>end){alert("Start date must be on or before end date.");return;}

async function loadGoogleAdsCampaigns(){
  if(googleAdsReportState.loading) return;
  googleAdsReportState.loading = true;
  googleAdsReportState.error = "";
  render();
  try{
    const now = new Date(), start = new Date(now);
    start.setDate(start.getDate()-29);
    const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const range = state.dashboard?.dateRange || {};
    const startDate = /^\d{4}-\d{2}-\d{2}$/.test(googleAdsReportState.startDate || "") ? googleAdsReportState.startDate : (/^\d{4}-\d{2}-\d{2}$/.test(range.start || "") ? range.start : iso(start));
    const endDate = /^\d{4}-\d{2}-\d{2}$/.test(googleAdsReportState.endDate || "") ? googleAdsReportState.endDate : (/^\d{4}-\d{2}-\d{2}$/.test(range.stop || "") ? range.stop : iso(now));
    googleAdsReportState.startDate = startDate;
    googleAdsReportState.endDate = endDate;
    const clientId = state.client?.id || state.user?.clientId;
    if(!clientId) throw new Error("Your portal user is not linked to a client. Ask the agency administrator to check your client access.");
    const query = "?clientId="+encodeURIComponent(clientId)+"&startDate="+encodeURIComponent(startDate)+"&endDate="+encodeURIComponent(endDate);
    const startMs = new Date(startDate+"T00:00:00").getTime(), endMs = new Date(endDate+"T00:00:00").getTime();
    const days = Math.max(1, Math.round((endMs-startMs)/86400000)+1);
    const isoDate = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const prevQuery = "?clientId="+encodeURIComponent(clientId)+"&startDate="+isoDate(new Date(startMs-days*86400000))+"&endDate="+isoDate(new Date(startMs-86400000));
    const [campaignResult, assetResult, keywordResult, searchResult, negativeResult, diagnosticResult, comparisonResult, callsResult] = await Promise.allSettled([
      apiRequest("/api/google-ads/campaigns"+query),
      apiRequest("/api/google-ads/assets"+query),
      apiRequest("/api/google-ads/keywords"+query),
      apiRequest("/api/google-ads/search-terms"+query),
      apiRequest("/api/google-ads/negative-keywords?clientId="+encodeURIComponent(clientId)),
      apiRequest("/api/google-ads/diagnostics?clientId="+encodeURIComponent(clientId)),
      apiRequest("/api/google-ads/campaigns"+prevQuery),
      apiRequest("/api/google-ads/calls"+query)
    ]);
    if(campaignResult.status === "rejected") throw campaignResult.reason;
    googleAdsReportState.data = campaignResult.value;
    googleAdsReportState.assetsData = assetResult.status === "fulfilled" ? assetResult.value : null;
    googleAdsReportState.assetError = assetResult.status === "rejected" ? (assetResult.reason?.message || "Asset data is temporarily unavailable.") : "";
    googleAdsReportState.keywordsData = keywordResult.status === "fulfilled" ? keywordResult.value : null;
    googleAdsReportState.keywordError = keywordResult.status === "rejected" ? (keywordResult.reason?.message || "Keyword data unavailable.") : "";
    googleAdsReportState.searchData = searchResult.status === "fulfilled" ? searchResult.value : null;
    googleAdsReportState.searchError = searchResult.status === "rejected" ? (searchResult.reason?.message || "Search terms unavailable.") : "";
    googleAdsReportState.negativeData = negativeResult.status === "fulfilled" ? negativeResult.value : null;
    googleAdsReportState.negativeError = negativeResult.status === "rejected" ? (negativeResult.reason?.message || "Negative keywords unavailable.") : "";
    googleAdsReportState.diagnosticsData = diagnosticResult.status === "fulfilled" ? diagnosticResult.value : null;
    googleAdsReportState.diagnosticsError = diagnosticResult.status === "rejected" ? (diagnosticResult.reason?.message || "Diagnostics unavailable.") : "";
    googleAdsReportState.comparisonData = comparisonResult.status === "fulfilled" ? comparisonResult.value : null;
    googleAdsReportState.callsData = callsResult.status === "fulfilled" ? callsResult.value : null;
    googleAdsReportState.callsError = callsResult.status === "rejected" ? (callsResult.reason?.message || "Call data unavailable.") : "";
  }catch(error){
    googleAdsReportState.error = error.message || "Unable to load Google Ads campaigns.";
    googleAdsReportState.data = null;
  }finally{
    googleAdsReportState.loading = false;
    render();
  }
}

function googleAdsTrendCharts(rows){
  const byDate = {};
  rows.forEach(r=>{
    const d=String(r.date||""); if(!d)return;
    if(!byDate[d])byDate[d]={date:d,spend:0,clicks:0,impressions:0,conversions:0,conversionValue:0};
    byDate[d].spend+=Number(r.spend||0);
    byDate[d].clicks+=Number(r.clicks||0);
    byDate[d].impressions+=Number(r.impressions||0);
    byDate[d].conversions+=Number(r.conversions||0);
    byDate[d].conversionValue+=Number(r.conversionValue||0);
  });
  const points=Object.values(byDate).sort((a,b)=>a.date.localeCompare(b.date)).slice(-14);
  if(!points.length)return '<div class="empty" style="padding:24px">Chart data will appear when Google Ads returns daily performance.</div>';
  const specs=[
    {key:"clicks",label:"Clicks",color:"#2878e8",format:v=>fmtNum(v)},
    {key:"impressions",label:"Impressions",color:"#16a085",format:v=>fmtNum(v)},
    {key:"spend",label:"Cost",color:"#e67e22",format:v=>fmtMoney(v)},
    {key:"conversionValue",label:"Conversion value",color:"#8e44ad",format:v=>fmtMoney(v)}
  ];
  return '<div class="grid two" style="gap:18px">'+specs.map(spec=>{
    const max=Math.max(1,...points.map(p=>p[spec.key]));
    const linePoints=points.map((p,i)=>{
      const x=20+(i*(260/Math.max(1,points.length-1)));
      const y=104-(p[spec.key]/max*78);
      return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    return '<div style="border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>'+spec.label+'</b><span class="muted" style="font-size:12px">Daily · last '+points.length+' dates</span></div><svg viewBox="0 0 300 132" role="img" aria-label="'+spec.label+' trend chart" style="width:100%;height:auto;margin-top:8px"><line x1="20" y1="26" x2="280" y2="26" stroke="var(--line)"/><line x1="20" y1="65" x2="280" y2="65" stroke="var(--line)"/><line x1="20" y1="104" x2="280" y2="104" stroke="var(--line)"/><polyline points="'+linePoints+'" fill="none" stroke="'+spec.color+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+points.map((p,i)=>{const x=20+(i*(260/Math.max(1,points.length-1)));const y=104-(p[spec.key]/max*78);return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3" fill="'+spec.color+'"><title>'+esc(p.date+' · '+spec.label+': '+spec.format(p[spec.key]))+'</title></circle>';}).join('')+'</svg><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)"><span>'+esc(points[0].date)+'</span><span>'+esc(points[points.length-1].date)+'</span></div></div>';
  }).join('')+'</div>';
}

function downloadGoogleAdsCsv(kind){
  const map={campaigns:googleAdsReportState.data?.campaigns||[],keywords:googleAdsReportState.keywordsData?.keywords||[],searchTerms:googleAdsReportState.searchData?.searchTerms||[],negativeKeywords:googleAdsReportState.negativeData?.negativeKeywords||[]};
  const rows=map[kind]||[]; if(!rows.length){alert('No rows available to export yet.');return;}
  const keys=[...new Set(rows.flatMap(row=>Object.keys(row)))];
  const cell=value=>'\"'+String(value==null?'':value).replace(/\"/g,'\"\"')+'\"';
  const csv=[keys.map(cell).join(','),...rows.map(row=>keys.map(key=>cell(row[key])).join(','))].join('\\r\\n');
  const link=document.createElement('a');link.href='data:text/csv;charset=utf-8,%EF%BB%BF'+encodeURIComponent(csv);link.download='google-ads-'+kind+'-'+(googleAdsReportState.startDate||'report')+'-'+(googleAdsReportState.endDate||'')+'.csv';document.body.appendChild(link);link.click();link.remove();
}
function googleAdsSubtab(tab){
  const panels=[...document.querySelectorAll("[data-google-subtab]")];
  const selected=panels.filter(el=>el.dataset.googleSubtab===tab);
  panels.forEach(el=>{el.style.display="none";});
  selected.forEach(el=>{
    el.style.display="";
    let parent=el.parentElement;
    while(parent){
      if(parent.matches && parent.matches("[data-google-subtab]")) parent.style.display="";
      parent=parent.parentElement;
    }
  });
  document.querySelectorAll("[data-google-tab]").forEach(el=>{el.classList.toggle("active",el.dataset.googleTab===tab);});
  window.googleAdsActiveSubtab=tab;
}
function googleAdsCampaigns(){
  if(!googleAdsReportState.data && !googleAdsReportState.loading && !googleAdsReportState.error) setTimeout(loadGoogleAdsCampaigns,0);
  const data=googleAdsReportState.data, rows=data?.campaigns||[], assetData=googleAdsReportState.assetsData, assets=assetData?.assets||[];
  const sum=key=>rows.reduce((n,r)=>n+Number(r[key]||0),0);
  const impressions=sum("impressions"),clicks=sum("clicks"),spend=sum("spend"),conversions=sum("conversions"),conversionValue=sum("conversionValue");
  const ctr=impressions?clicks/impressions*100:0,cpc=clicks?spend/clicks:0;
  const kpi=(label,value)=>'<div class="card kpi"><div class="label">'+esc(label)+'</div><div class="value">'+value+'</div></div>';
  const error=googleAdsReportState.error?'<div class="error-message" style="margin:14px 0">'+esc(googleAdsReportState.error)+'</div>':"";

async function updateSocialPostStatus(id,status){
 try{
  await apiRequest('/api/social-posts/'+encodeURIComponent(id)+'/status',{method:'PATCH',body:JSON.stringify({status})});
  await loadSocialCalendar();

async function syncSocialCalendarFromMeta(){
 const admin=state.user?.role==="admin";
 let clientId=null;
 if(admin){
  try{
   const d=await apiRequest("/api/admin/overview");
   const clients=d.clients||[];
   if(!clients.length){alert("No clients are available to sync.");return;}
   const choices=clients.map((c,i)=>(i+1)+". "+c.display_name).join("\n");
   const choice=prompt("Sync Instagram and Facebook posts for which client?\n"+choices,"1");
   if(choice===null)return;
   const idx=Number(choice)-1;
   if(!Number.isInteger(idx)||idx<0||idx>=clients.length){alert("Invalid client selection.");return;}
   clientId=clients[idx].id;
  }catch(e){alert("Could not load clients: "+e.message);return;}
 }
 const box=document.getElementById("social-calendar-live");
 const button=document.getElementById("social-meta-sync-button");
 if(button){button.disabled=true;button.textContent="Syncing Meta posts…";}
 if(box)box.insertAdjacentHTML("afterbegin",'<div id="social-meta-sync-note" class="muted" style="padding:8px 0">Fetching available Facebook and Instagram posts…</div>');
 try{
  const payload=admin?{clientId}:{};
  const d=await apiRequest("/api/meta/social/sync",{method:"POST",body:JSON.stringify(payload)});
  await loadSocialCalendar();
  const calendar=document.getElementById("social-calendar-live");
  if(calendar){
   const note=document.createElement("div");
   note.className="muted";
   note.style.padding="8px 0";
   note.textContent="Meta sync complete: "+(d.postsSynced||0)+" posts imported or updated across "+(d.pagesSynced||0)+" Pages.";
   calendar.prepend(note);
  }
 }catch(e){
  const note=document.getElementById("social-meta-sync-note");
  if(note)note.textContent="Meta sync could not complete: "+e.message;
  else alert("Meta sync could not complete: "+e.message);
 }finally{
  const current=document.getElementById("social-meta-sync-button");
  if(current){current.disabled=false;current.textContent="↻ Sync Instagram & Facebook";}
 }
}
let socialCalendarMonthOffset=0;
function shiftSocialCalendarMonth(delta){socialCalendarMonthOffset+=delta;loadSocialCalendar();}
function socialCalendarDateKey(value){
 if(!value)return "";
 const d=new Date(value);if(Number.isNaN(d.getTime()))return "";
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function socialCalendarPlatformIcon(platform){
 const p=String(platform||"").toLowerCase();
 return p.includes("instagram")?"📸":p.includes("facebook")?"🔵":p.includes("linkedin")?"💼":p.includes("youtube")?"▶️":"🗓️";
}
async function loadSocialCalendar(){
 const box=document.getElementById("social-calendar-live");if(!box)return;
 box.innerHTML='<div class="muted">Loading social posts…</div>';
 try{
  const admin=state.user?.role==="admin";
  const d=await apiRequest(admin?"/api/admin/social-posts":"/api/social-posts");
  const filter=document.getElementById("social-status-filter")?.value||"all";
  const rows=(d.posts||[]).filter(p=>filter==="all"||p.status===filter);
  const now=new Date();
  const month=new Date(now.getFullYear(),now.getMonth()+socialCalendarMonthOffset,1);
  const year=month.getFullYear(), monthIndex=month.getMonth();
  const monthLabel=month.toLocaleDateString("en-US",{month:"long",year:"numeric"});
  const firstDay=new Date(year,monthIndex,1);
  const gridStart=new Date(year,monthIndex,1-firstDay.getDay());
  const gridEnd=new Date(year,monthIndex+1,1);
  const dayCount=Math.ceil((gridEnd-gridStart)/(24*60*60*1000)/7)*7;
  const grouped={};
  rows.forEach(p=>{
   const dateValue=p.scheduled_at||p.published_at||p.created_at;
   const key=socialCalendarDateKey(dateValue);
   if(key){(grouped[key]||(grouped[key]=[])).push(p);}
  });
  Object.values(grouped).forEach(items=>items.sort((a,b)=>new Date(a.scheduled_at||a.published_at||a.created_at)-new Date(b.scheduled_at||b.published_at||b.created_at)));
  const weekdays=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  let html='<div class="social-calendar-toolbar"><div class="social-calendar-nav"><button type="button" onclick="shiftSocialCalendarMonth(-1)" aria-label="Previous month">‹</button><button type="button" onclick="socialCalendarMonthOffset=0;loadSocialCalendar()">Today</button><button type="button" onclick="shiftSocialCalendarMonth(1)" aria-label="Next month">›</button><div class="social-calendar-month">'+esc(monthLabel)+'</div></div><div class="muted">'+rows.length+' posts</div></div><div style="overflow-x:auto"><div class="social-calendar-grid">';
  html+=weekdays.map(day=>'<div class="social-calendar-weekday">'+day+'</div>').join("");
  for(let i=0;i<dayCount;i++){
   const date=new Date(gridStart);date.setDate(gridStart.getDate()+i);
   const key=socialCalendarDateKey(date);

function seoTrendChart(history){

 if(points.length<2)return '<p class="muted">Trend chart will appear after at least two successful syncs.</p>';
 const max=Math.max(1,...points.map(x=>Number(x.payload.clicks||0)),...points.map(x=>Number(x.payload.impressions||0)));
 const bars=points.map(x=>{const p=x.payload||{},h=Math.max(4,Math.round((Number(p.clicks||0)/max)*100)),im=Math.max(4,Math.round((Number(p.impressions||0)/max)*100));return '<div style="flex:1;min-width:24px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;height:150px" title="'+esc(x.metric_date||"")+' | clicks '+fmtNum(p.clicks)+' | impressions '+fmtNum(p.impressions)+'"><div style="height:'+im+'%;background:var(--primary);opacity:.35;border-radius:4px 4px 0 0"></div><div style="height:'+h+'%;background:var(--primary);border-radius:4px 4px 0 0"></div><div class="muted" style="font-size:10px;text-align:center;overflow:hidden">'+esc((x.metric_date||"").slice(5))+'</div></div>';}).join('');
 return '<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px"><span style="display:inline-flex;align-items:center;gap:5px;font-size:12px"><i style="display:inline-block;width:9px;height:9px;background:var(--primary);border-radius:2px"></i>Clicks</span><span style="display:inline-flex;align-items:center;gap:5px;font-size:12px"><i style="display:inline-block;width:9px;height:9px;background:var(--primary);opacity:.35;border-radius:2px"></i>Impressions</span></div><div style="display:flex;align-items:flex-end;gap:8px;min-height:160px;padding-top:8px">'+bars+'</div><p class="muted" style="font-size:12px">Bars compare clicks and impressions across successful sync snapshots. Both use the same scale for visual context.</p>';

 const p=snap.payload||{},rows=[["Section","Query or Page","Clicks","Impressions","CTR","Average position"]];
 (p.queries||[]).forEach(x=>rows.push(["Query",x.query||"",x.clicks||0,x.impressions||0,Number(x.ctr||0),Number(x.position||0)]));

async function openProfileSettings(){
  const u=state.user||{};
  const name=prompt('Account name:',u.name||''); if(name===null)return;
  const email=prompt('Email address:',u.email||''); if(email===null)return;
  try{
    const d=await apiRequest('/api/auth/profile',{method:'PATCH',body:JSON.stringify({name:name.trim(),email:email.trim()})});
    state.user={...(state.user||{}),...d.user};
    localStorage.setItem('aqsetu_user',JSON.stringify(state.user));
    render(); alert('Account settings updated.');
  }catch(e){alert(e.message);}
}

function openNotificationSettings(){
  const enabled=localStorage.getItem('aqsetu_notifications')==='true';
  if(confirm(enabled?'Notifications are ON. Turn them OFF?':'Notifications are OFF. Turn them ON?')){
    localStorage.setItem('aqsetu_notifications',String(!enabled));
    alert('Notification setting updated.');
  }
}

async function openChangePassword(){
  const currentPassword=prompt('Current password:'); if(currentPassword===null)return;
  const newPassword=prompt('New password (minimum 8 characters):'); if(newPassword===null)return;
  const confirmPassword=prompt('Confirm new password:'); if(confirmPassword===null)return;
  if(newPassword.length<8){alert('New password must be at least 8 characters.');return;}
  if(newPassword!==confirmPassword){alert('New passwords do not match.');return;}
  try{
    await apiRequest('/api/auth/password',{method:'POST',body:JSON.stringify({currentPassword,newPassword})});
    alert('Password changed successfully.');
  }catch(e){alert(e.message);}
}

function render(){

  document.getElementById("root").innerHTML =
    state.loggedIn
      ? layout()
      : login();

}


/* =========================================================
   INITIAL SESSION CHECK
   ========================================================= */

async function initializeApp(){

  const token =
    sessionStorage.getItem("aqsetu_token");

  const savedUser =
    sessionStorage.getItem("aqsetu_user");

  if(token){

    state.loggedIn = true;

    if(savedUser){

      try{

        state.user =
          JSON.parse(savedUser);

      }
      catch{

        state.user = null;

      }

    }

    await loadClient();

  }
  else{

    render();

  }

}


/* START APPLICATION */

initializeApp();
