<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AQ Setu — Client Portal</title>

<style>
:root{
  --green:#2E8B57;
  --purple:#5A3FA0;
  --light:#F5F7FA;
  --ink:#222222;
  --muted:#6b7280;
  --line:#e7e9ee;
  --white:#fff;
  --red:#e5484d;
  --orange:#d98b20;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:var(--light);
  color:var(--ink)
}

button,input,select{font:inherit}

.app{
  display:flex;
  min-height:100vh
}

.sidebar{
  width:245px;
  background:#fff;
  border-right:1px solid var(--line);
  padding:22px 15px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:5
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 8px 24px
}

.brand img{
  width:47px;
  height:47px;
  object-fit:cover;
  border-radius:8px
}

.brand strong{font-size:18px}

.brand small{
  display:block;
  color:var(--green);
  font-size:10px;
  font-weight:700;
  margin-top:2px
}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px
}

.nav button{
  border:0;
  background:transparent;
  text-align:left;
  padding:12px 13px;
  border-radius:10px;
  color:#555;
  cursor:pointer;
  display:flex;
  gap:12px;
  align-items:center
}

.nav button:hover{background:#f3f5f7}

.nav button.active{
  background:linear-gradient(90deg,#eef8f2,#f2effa);
  color:var(--purple);
  font-weight:700
}

.icon{
  width:22px;
  text-align:center
}

.sidebar-footer{
  position:absolute;
  left:15px;
  right:15px;
  bottom:18px;
  border-top:1px solid var(--line);
  padding-top:14px;
  color:var(--muted);
  font-size:12px
}

.main{
  margin-left:245px;
  width:calc(100% - 245px)
}

.topbar{
  height:76px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:4
}

.crumb{
  color:var(--muted);
  font-size:13px
}

.user{
  display:flex;
  align-items:center;
  gap:10px
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--green),var(--purple));
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:700
}

.content{
  padding:28px;
  max-width:1500px;
  margin:auto
}

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px
}

.page-title h1{
  font-size:27px;
  margin:0
}

.page-title p{
  color:var(--muted);
  margin:6px 0 0
}

.btn{
  border:0;
  border-radius:9px;
  padding:10px 16px;
  cursor:pointer;
  font-weight:700
}

.btn-primary{
  background:var(--green);
  color:#fff
}

.btn-purple{
  background:var(--purple);
  color:#fff
}

.btn-light{
  background:#fff;
  border:1px solid var(--line)
}

.grid{
  display:grid;
  gap:16px
}

.kpi-grid{
  grid-template-columns:repeat(4,1fr)
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  box-shadow:0 2px 10px rgba(30,35,45,.03)
}

.kpi .label{
  color:var(--muted);
  font-size:13px
}

.kpi .value{
  font-size:25px;
  font-weight:800;
  margin:9px 0
}

.up{
  color:var(--green);
  font-size:12px;
  font-weight:700
}

.down{
  color:var(--red);
  font-size:12px;
  font-weight:700
}

.two{
  grid-template-columns:1.5fr 1fr
}

.three{
  grid-template-columns:repeat(3,1fr)
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px
}

.section-head h3{
  margin:0;
  font-size:16px
}

.chart{
  height:220px;
  position:relative;
  overflow:hidden
}

.chart svg{
  width:100%;
  height:100%
}

.table{
  width:100%;
  border-collapse:collapse
}

.table th,
.table td{
  text-align:left;
  padding:13px 10px;
  border-bottom:1px solid var(--line);
  font-size:13px
}

.table th{
  color:var(--muted);
  font-weight:600
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:700
}

.green{
  background:#eaf7ef;
  color:var(--green)
}

.purple{
  background:#f0ecfb;
  color:var(--purple)
}

.orange{
  background:#fff5e6;
  color:var(--orange)
}

.red{
  background:#fff0f0;
  color:var(--red)
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:16px
}

.tabs button{
  border:1px solid var(--line);
  background:#fff;
  padding:9px 15px;
  border-radius:8px;
  cursor:pointer
}

.tabs button.active{
  background:var(--green);
  color:#fff;
  border-color:var(--green)
}

.list{
  display:flex;
  flex-direction:column;
  gap:10px
}

.list-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px
}

.person{
  display:flex;
  align-items:center;
  gap:12px
}

.mini{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#edf2ef;
  display:grid;
  place-items:center;
  color:var(--green);
  font-weight:800
}

.actions{
  display:flex;
  gap:8px
}

.approval{
  display:grid;
  grid-template-columns:100px 1fr auto;
  gap:15px;
  align-items:center
}

.thumb{
  width:100px;
  height:70px;
  border-radius:8px;
  background:linear-gradient(135deg,#dfece5,#e7def6);
  display:grid;
  place-items:center;
  color:var(--purple);
  font-weight:800
}

.notification{
  display:flex;
  gap:13px;
  padding:14px;
  border-bottom:1px solid var(--line)
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--green);
  margin-top:7px
}

.login-wrap{
  min-height:100vh;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 85% 15%,#eee8fb,transparent 35%),
    #f7faf8
}

.login{
  width:min(420px,92vw);
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:34px;
  box-shadow:0 12px 45px rgba(30,30,40,.08)
}

.login-logo{
  text-align:center
}

.login-logo img{
  width:110px;
  height:110px;
  object-fit:cover;
  border-radius:12px
}

.login h1{
  text-align:center;
  font-size:25px
}

.login p{
  text-align:center;
  color:var(--muted)
}

.field{
  margin:14px 0
}

.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:6px
}

.field input{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:9px;
  outline:none
}

.field input:focus{
  border-color:var(--green)
}

.full{
  width:100%
}

.hidden{
  display:none!important
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(20,24,30,.45);
  display:grid;
  place-items:center;
  z-index:100;
}
.modal{
  width:min(520px,92vw);
  background:#fff;
  border-radius:16px;
  padding:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.18);
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
.modal-head h2{margin:0;font-size:20px}
.modal-close{
  border:0;background:transparent;font-size:24px;cursor:pointer;color:var(--muted);
}
.modal-actions{
  display:flex;justify-content:flex-end;gap:10px;margin-top:20px;
}
.error-message{
  color:var(--red);
  background:#fff0f0;
  border:1px solid #f4cccc;
  padding:10px;
  border-radius:8px;
  font-size:13px;
  margin:12px 0
}

.loading{
  opacity:.7;
  pointer-events:none
}

.hero{
  background:linear-gradient(135deg,var(--green),var(--purple));
  color:#fff;
  border:0
}

.hero .muted{
  color:#eee
}

.metric-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.metric{
  background:rgba(255,255,255,.13);
  padding:14px;
  border-radius:10px
}

.metric b{
  font-size:22px;
  display:block;
  margin-top:5px
}

.empty{
  padding:50px;
  text-align:center;
  color:var(--muted)
}

@media(max-width:1000px){
  .kpi-grid{
    grid-template-columns:repeat(2,1fr)
  }

  .two,.three{
    grid-template-columns:1fr
  }

  .sidebar{
    width:72px
  }

  .brand div,
  .nav button span,
  .sidebar-footer{
    display:none
  }

  .brand{
    justify-content:center
  }

  .main{
    margin-left:72px;
    width:calc(100% - 72px)
  }

  .nav button{
    justify-content:center
  }

  .content{
    padding:18px
  }

  .approval{
    grid-template-columns:70px 1fr
  }

  .thumb{
    width:70px;
    height:60px
  }
}

@media(max-width:600px){
  .topbar{
    padding:0 15px
  }

  .content{
    padding:14px
  }

  .kpi-grid{
    grid-template-columns:1fr 1fr
  }

  .kpi .value{
    font-size:20px
  }

  .page-title h1{
    font-size:22px
  }

  .metric-row{
    grid-template-columns:1fr
  }

  .approval{
    grid-template-columns:1fr
  }

  .thumb{
    width:100%;
    height:110px
  }
}
</style>
</head>

<body>

<div id="root"></div>

<script>

/* =========================================================
   AQ SETU CLIENT PORTAL
   Frontend connected to Node.js backend
   ========================================================= */

// Served by the Express backend, so use the same origin. Fall back to
// localhost only if the file is opened directly from disk.
const API_URL = location.protocol.startsWith("http")
  ? location.origin
  : "http://localhost:5000";

const state = {
  loggedIn: false,
  page: "Dashboard",
  role: "client",
  adminOverview: null,
  adminLoading: false,
  adminError: null,
  adminIntegrations: null,
  leadStatus: "All Leads",
  user: null,
  client: null,
  dashboard: null,
  dashboardLoading: false,
  dashboardError: null,
  meta: {
    status: null,        // response of /api/meta/status
    accounts: null,      // response of /api/meta/accounts
    syncing: false,
    message: null,       // {type:"ok"|"error", text}
    datePreset: "last_30d"
  }
};

const clientPages = [
  "Dashboard",
  "Campaigns",
  "Leads",
  "Social Media",
  "Content Approval",
  "SEO",
  "Reports",
  "Notifications",
  "Profile"
 ];

const adminPages = ["Admin Overview","Clients","Users","Integrations","Profile"];

const icons = {
  "Admin Overview":"⌂",
  "Clients":"▦",
  "Users":"♙",
  "Integrations":"◈",
  "Dashboard":"⌂",
  "Campaigns":"◈",
  "Leads":"♙",
  "Social Media":"◫",
  "Content Approval":"✓",
  "SEO":"⌕",
  "Reports":"▤",
  "Notifications":"♢",
  "Profile":"⚙"
};


/* =========================================================
   LOGIN SCREEN
   ========================================================= */

function login(){

  return `
    <div class="login-wrap">

      <div class="login">

        <div class="login-logo">
          <img src="logo.jpg" alt="AQ Setu">
        </div>

        <h1>Welcome Back!</h1>

        <p>
          Sign in to your AQ Setu account
        </p>

        <div id="login-error" class="error-message hidden"></div>

        <div class="field">

          <label>Email address</label>

          <input
            id="email"
            type="email"
            value="admin@aqsetu.in"
            placeholder="Email address"
            autocomplete="username"
          >

        </div>

        <div class="field">

          <label>Password</label>

          <input
            id="password"
            type="password"
            value="Demo@12345"
            placeholder="Password"
            autocomplete="current-password"
          >

        </div>

        <button
          id="login-button"
          class="btn btn-primary full"
          onclick="doLogin()"
        >
          Sign In
        </button>

        <div style="
          text-align:center;
          color:#999;
          margin:16px 0;
          font-size:12px
        ">
          AQ Setu test client · AQSETU-001
        </div>

        <button
          class="btn btn-light full"
          onclick="demoLogin()"
        >
          Continue as AQ Setu
        </button>

      </div>

    </div>
  `;
}


/* =========================================================
   REAL LOGIN
   ========================================================= */

async function doLogin(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const errorBox =
    document.getElementById("login-error");

  const loginButton =
    document.getElementById("login-button");

  errorBox.classList.add("hidden");

  if(!email || !password){

    errorBox.textContent =
      "Please enter your email and password.";

    errorBox.classList.remove("hidden");

    return;
  }

  loginButton.textContent = "Signing in...";
  loginButton.classList.add("loading");

  try{

    const response = await fetch(
      `${API_URL}/api/auth/login`,
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          email,
          password
        })
      }
    );

    const data = await response.json();

    if(!response.ok || !data.success){

      throw new Error(
        data.message || "Login failed."
      );
    }

    /*
      Save authentication information
    */

    localStorage.setItem(
      "aqsetu_token",
      data.token
    );

    localStorage.setItem(
      "aqsetu_user",
      JSON.stringify(data.user)
    );

    state.loggedIn = true;
    state.user = data.user;

    /*
      Load actual client information
    */

    await loadClient();

  }
  catch(error){

    console.error("Login error:",error);

    errorBox.textContent =
      error.message ||
      "Unable to connect to AQ Setu server.";

    errorBox.classList.remove("hidden");

  }
  finally{

    if(document.getElementById("login-button")){

      loginButton.textContent = "Sign In";
      loginButton.classList.remove("loading");

    }

  }
}


/* =========================================================
   DEMO LOGIN
   ========================================================= */

async function demoLogin(){

  const email =
    "admin@aqsetu.in";

  const password =
    "Demo@12345";

  document.getElementById("email").value = email;
  document.getElementById("password").value = password;

  await doLogin();
}


/* =========================================================
   LOAD CLIENT FROM BACKEND
   ========================================================= */

async function loadClient(){

  const token =
    localStorage.getItem("aqsetu_token");

  if(!token){

    logout();
    return;
  }

  if(state.user?.role === "admin"){
    state.client = null;
    await loadAdminOverview();
    state.loggedIn = true;
    render();
    return;
  }

  try{

    const response = await fetch(
      `${API_URL}/api/clients`,
      {
        method:"GET",

        headers:{
          "Authorization":`Bearer ${token}`
        }
      }
    );

    const data = await response.json();

    if(!response.ok || !data.success){

      throw new Error(
        data.message || "Unable to load client."
      );
    }

    state.client = data.client;

    state.loggedIn = true;

    await Promise.all([loadDashboard(), loadMetaStatus()]);

    render();

  } catch(error){

    console.error(
      "Client loading error:",
      error
    );

    localStorage.removeItem("aqsetu_token");

    state.loggedIn = false;
    state.user = null;
    state.client = null;
    state.dashboard = null;

    render();

  }

}
async function loadAdminOverview(){
  state.adminLoading = true;
  state.adminError = null;
  try{
    state.adminOverview = await apiRequest("/api/admin/overview");
  }catch(error){
    console.error("Admin overview error:", error);
    state.adminError = error.message || "Unable to load admin data.";
  }finally{
    state.adminLoading = false;
  }
}

async function loadAdminIntegrations(){
  try{ state.adminIntegrations = await apiRequest("/api/admin/integrations"); }
  catch(error){ state.adminIntegrations = {success:false,integrations:[],error:error.message}; }
}
async function adminRefresh(){ await loadAdminOverview(); if(state.page === "Integrations") await loadAdminIntegrations(); render(); }
async function createAdminClient(){
  const clientCode=prompt("Client code (e.g. ABC-001):"), companyName=prompt("Company name:"), displayName=prompt("Display name:");
  if(!clientCode||!companyName||!displayName)return;
  try{await apiRequest("/api/admin/clients",{method:"POST",body:JSON.stringify({clientCode,companyName,displayName})});await adminRefresh();}catch(e){alert(e.message);}
}
async function toggleAdminClient(id,current){try{await apiRequest("/api/admin/clients/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status:current==="active"?"inactive":"active"})});await adminRefresh();}catch(e){alert(e.message);}}
function openAddUserModal(){
  const clients=state.adminOverview?.clients||[];
  if(!clients.length){alert("Create a client first.");return;}
  const existing=document.getElementById("add-user-modal");
  if(existing) existing.remove();
  document.body.insertAdjacentHTML("beforeend",`
    <div id="add-user-modal" class="modal-backdrop" onclick="if(event.target===this) closeAddUserModal()">
      <div class="modal">
        <div class="modal-head">
          <h2>Add Client User</h2>
          <button class="modal-close" type="button" onclick="closeAddUserModal()">×</button>
        </div>
        <div class="field">
          <label>Client</label>
          <select id="new-user-client" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:9px">
            ${clients.map(x=>`<option value="${esc(x.id)}">${esc(x.display_name)} (${esc(x.client_code)})</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>User name</label>
          <input id="new-user-name" type="text" placeholder="e.g. Rahul Sharma">
        </div>
        <div class="field">
          <label>Email address</label>
          <input id="new-user-email" type="email" placeholder="e.g. rahul@company.com">
        </div>
        <div class="field">
          <label>Temporary password</label>
          <input id="new-user-password" type="password" minlength="8" placeholder="Minimum 8 characters">
        </div>
        <div id="new-user-error" class="error-message hidden"></div>
        <div class="modal-actions">
          <button class="btn btn-light" type="button" onclick="closeAddUserModal()">Cancel</button>
          <button class="btn btn-primary" type="button" onclick="submitAdminUser()">Create User</button>
        </div>
      </div>
    </div>
  `);
  document.getElementById("new-user-name").focus();
}
function closeAddUserModal(){
  document.getElementById("add-user-modal")?.remove();
}
async function submitAdminUser(){
  const clientId=document.getElementById("new-user-client")?.value;
  const name=document.getElementById("new-user-name")?.value.trim();
  const email=document.getElementById("new-user-email")?.value.trim();
  const password=document.getElementById("new-user-password")?.value;
  const error=document.getElementById("new-user-error");
  if(!clientId||!name||!email||!password){error.textContent="Please fill in all fields.";error.classList.remove("hidden");return;}
  if(password.length<8){error.textContent="Password must be at least 8 characters.";error.classList.remove("hidden");return;}
  try{
    await apiRequest("/api/admin/users",{method:"POST",body:JSON.stringify({clientId,name,email,password})});
    closeAddUserModal();
    await adminRefresh();
  }catch(e){
    error.textContent=e.message||"Unable to create user.";
    error.classList.remove("hidden");
  }
}
async function toggleAdminUser(id,current){try{await apiRequest("/api/admin/users/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status:current==="active"?"inactive":"active"})});await adminRefresh();}catch(e){alert(e.message);}}

async function loadDashboard() {

  state.dashboardLoading = true;
  state.dashboardError = null;

  try {

    const data = await apiRequest("/api/dashboard");

    if(data.success){
      state.dashboard = data;
    }

  } catch(error){

    console.error("Dashboard loading error:", error);
    state.dashboardError =
      error.message || "Unable to load dashboard data.";

  } finally {

    state.dashboardLoading = false;

  }

}

/* =========================================================
   META CONNECTION / SYNC (all calls go to our backend;
   the browser never sees a Meta token)
   ========================================================= */

async function loadMetaStatus(){
  try{
    state.meta.status = await apiRequest("/api/meta/status");
  }catch(error){
    console.error("Meta status error:", error);
    state.meta.message = { type:"error", text:error.message };
  }
}

async function connectMeta(){
  try{
    const data = await apiRequest("/api/meta/connect");
    const popup = window.open(data.authUrl, "aqsetu_meta", "width=620,height=760");
    if(!popup){
      window.location.href = data.authUrl;
      return;
    }
    const timer = setInterval(async () => {
      if(popup.closed){
        clearInterval(timer);
        await loadMetaStatus();
        await loadDashboard();
        render();
      }
    }, 800);
  }catch(error){
    state.meta.message = { type:"error", text:error.message };
    render();
  }
}

async function loadMetaAccounts(){
  try{
    state.meta.accounts = await apiRequest("/api/meta/accounts");
  }catch(error){

/* =========================================================
   FORMAT HELPERS (missing values render as an em dash)
   ========================================================= */

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function fmtNum(v){
  return (v === null || v === undefined || v === "")
    ? "—" : Number(v).toLocaleString("en-IN");
}

function fmtMoney(v){
  if(v === null || v === undefined || v === "") return "—";
  const cur = state.dashboard?.currency;
  try{
    return Number(v).toLocaleString("en-IN", {
      style:"currency",
      currency: cur || "INR",
      maximumFractionDigits: 2
    });
  }catch{
    return Number(v).toLocaleString("en-IN", { maximumFractionDigits:2 });
  }
}

function fmtPct(v){
  return (v === null || v === undefined || v === "")
    ? "—" : `${Number(v).toFixed(2)}%`;
}

function fmtDate(d){
  if(!d) return "";
  const dt = new Date(d.length === 10 ? d + "T00:00:00" : d);
  return isNaN(dt) ? "" : dt.toLocaleDateString("en-IN", {
    day:"2-digit", month:"short", year:"numeric"
  });
}

function rangeLabel(){
  const r = state.dashboard?.dateRange;
  return r ? `${fmtDate(r.start)} – ${fmtDate(r.stop)}` : "No data yet";
}

/* One banner that covers every non-happy state. */
function dataBanner(){
  const d = state.dashboard;
  const box = (text, kind = "info", action = "") => `
    <div class="card" style="margin-bottom:16px;border-left:4px solid ${
      kind === "error" ? "#c0392b" : kind === "warn" ? "#e67e22" : "var(--purple)"
    }">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <span style="font-size:14px">${text}</span>${action}
      </div>
    </div>`;
  const goCampaigns = `<button class="btn btn-primary" onclick="go('Campaigns')">Open Campaigns</button>`;

  if(state.dashboardLoading && !d) return box("Loading your marketing data…");
  if(state.dashboardError) return box(`Could not load dashboard data: ${esc(state.dashboardError)}`, "error",
    `<button class="btn btn-light" onclick="reloadDashboard()">Retry</button>`);
  if(!d) return "";
  if(d.meta?.expired) return box("Your Meta connection has expired. Reconnect to keep data fresh.", "warn", goCampaigns);
  if(d.dataSource === "meta") return "";
  if(!d.meta?.connected) return box(
    d.dataSource === "manual"
      ? "Showing sample data. Connect a Meta ad account to see real performance."
      : "No Meta ad account is connected yet.", "warn", goCampaigns);
  return box("Meta is connected but no campaigns have been synced yet.", "info", goCampaigns);
}

/* =========================================================
   AUTHENTICATED API HELPER
   ========================================================= */

async function apiRequest(
  endpoint,
  options = {}
){

  const token =
    localStorage.getItem("aqsetu_token");

  if(!token){

    logout();

    throw new Error(
      "Authentication required"
    );
  }

  const response = await fetch(
    `${API_URL}${endpoint}`,
    {
      ...options,

      headers:{
        "Content-Type":"application/json",
        ...(options.headers || {}),
        "Authorization":`Bearer ${token}`
      }
    }
  );

  const data = await response.json();

  if(response.status === 401){

    logout();

    throw new Error(
      "Session expired. Please log in again."
    );
  }

  if(!response.ok){

    throw new Error(
      data.message || "Request failed."
    );
  }

  return data;
}

function render(){

    state.loggedIn
      ? layout()
      : login();

}


/* =========================================================
   INITIAL SESSION CHECK
   ========================================================= */

async function initializeApp(){

  const token =
    localStorage.getItem("aqsetu_token");

  const savedUser =
    localStorage.getItem("aqsetu_user");

  if(token){

    state.loggedIn = true;

    if(savedUser){

      try{

        state.user =
          JSON.parse(savedUser);

      }
      catch{

        state.user = null;

      }

    }

    await loadClient();

  }
  else{

    render();

  }

}


/* START APPLICATION */
